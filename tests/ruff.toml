# Test-scoped ruff config. Nested here so ruff's config discovery picks this file (not the
# repo-root pyproject.toml's [tool.ruff]) for every file under tests/ -- see
# py-ci-shared/configs/ruff-tests.toml for the full rationale and the base rule set this extends.
#
# The root pyproject.toml's [tool.ruff] keeps `exclude = ["tests", ...]` and stays scoped to
# src/; run this config as its own gate via `ruff check tests/`.
#
# ruff expands environment variables in `extend`, so PY_CI_SHARED_DIR may point at any py-ci-shared
# checkout rather than a sibling directory -- same form the root pyproject.toml's [tool.ruff] uses.
extend = "$PY_CI_SHARED_DIR/configs/ruff-tests.toml"
target-version = "py39"

[lint.mccabe]
# The same limit as src/ ([tool.ruff.lint.mccabe] in pyproject.toml): C901 is enforced by the blocking `ruff check tests` step in CI and
# pre-commit, with no ignore. The fuzz-combo runners that used to exceed it were split into helpers.
max-complexity = 25
