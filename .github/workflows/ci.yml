name: CI

on:
  push:
    branches: [master]
    # A docs-only push otherwise spends 30 shards plus the heavy-serial legs out of a ~20-concurrent-job
    # budget shared across every repo on this account, and this repo pushes directly to master constantly.
    # Deliberately NOT mirrored onto pull_request: master's branch protection requires the check "CI
    # required checks", and a required check that never runs leaves a PR permanently pending rather than
    # skipped -- a docs-only PR would become unmergeable. Only the push leg is safe to skip.
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "audits/**"
      - "LICENSE"
  pull_request:
    branches: [master]
  schedule:
    # Sunday 03:17 UTC. The weekly run is the one that sweeps every OS and every Python version; a
    # push only exercises the representative leg. Off the hour on purpose -- GitHub queues scheduled
    # workflows account-wide, and everyone's cron sits on :00.
    - cron: "17 3 * * 0"
  workflow_dispatch:
    inputs:
      full_matrix:
        description: "Run the full three-OS, all-version sweep instead of the representative leg"
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Reverted 2026-07-09: cancel-in-progress:false for push (kept only for PR) was meant to let a
  # push-to-master run survive to completion so codecov gets an upload (0% codecov incident,
  # 2026-0x-xx: 42 cancelled / 7 failed / 0 succeeded across 50 consecutive pushes). Under today's
  # push volume that "fix" just traded one failure mode for a worse one: non-cancelling runs queue
  # up FIFO behind the concurrency group with nothing to clear the backlog, so runs sit queued for
  # 30+ minutes and STILL never reach completion -- 0% codecov either way, but now nothing finishes
  # at all (confirmed on mypy-full.yml's identical pattern the same day). cancel-in-progress:true
  # at least lets the latest commit's run actually start and finish instead of rotting in queue.
  cancel-in-progress: true

permissions:
  contents: read

env:
  # The single leg a push actually runs, and therefore the only one that can publish coverage. Defined
  # here once: the matrix generator reads both values from the environment and the coverage steps compare
  # against them, so changing the leg in one place cannot leave the other pointing at something no push
  # runs -- which is how the coverage upload silently stopped the last time this gate named a version by
  # hand.
  #
  # A push runs all three OSes on ONE Python version. The version is what is held fixed, not the platform:
  # a user on Windows or macOS is failed by a platform bug on any version, while a version bug is caught by
  # the Sunday sweep. Thirty jobs per push rather than the 180 a full cross product would take.
  #
  # COVERAGE_OS names the single leg allowed to publish coverage. Three legs uploading the same lines would
  # not improve the report, and Linux is where this project's codecov history and its numba-coverage
  # companion workflow already live.
  COVERAGE_OS: "ubuntu-latest"
  REPRESENTATIVE_PYTHON: "3.12"

jobs:
  # The matrix is chosen by EVENT, not hard-coded, so one job definition serves both cadences.
  #
  # A push gets every OS on ONE Python version, each still sharded 10 ways: 30 jobs instead of the 180 a
  # full cross product would take. The platform is what a push protects and the version is what it holds
  # fixed, because a Windows or macOS user is failed by a platform bug on any version, while a
  # version-specific bug is caught by the Sunday sweep. The ceiling this is sized against is concurrency,
  # not minutes -- ~20 concurrent jobs shared across every repo on the account, and the old 50-job push
  # matrix spent hours queued (measured 2026-09-07: 30 of 86 jobs done after two hours).
  #
  # The weekly sweep is where every OS and every supported Python version run. What that trades away is
  # worth naming: version-specific breaks are then found up to a week after the commit that caused them.
  # Two such bugs were caught on 2026-09-08 by version legs alone -- tomllib missing below 3.11 (only
  # 3.9/3.10 saw it) and an ast.dump similarity that differs between 3.12 and 3.14 -- and under this
  # cadence both would have surfaced in the Sunday run instead of on the push.
  #
  # The version axis is not left entirely unwatched between sweeps: ``test-heavy-serial`` below still runs
  # test_core.py across every supported version on every push, so a version-specific regression in that
  # file still fails the commit that caused it. That is 20 short jobs, which is why it does not
  # reintroduce the queue problem.
  matrix-setup:
    name: Choose the matrix for this event
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.build.outputs.matrix }}
      full: ${{ steps.build.outputs.full }}
      # Exported so test-heavy-serial runs the same single version a push uses, instead of naming one by
      # hand and drifting from it.
      representative_python: ${{ env.REPRESENTATIVE_PYTHON }}
    steps:
      - name: Build the job list
        id: build
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          FORCE_FULL: ${{ inputs.full_matrix }}
          REPRESENTATIVE_PYTHON: ${{ env.REPRESENTATIVE_PYTHON }}
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os

          full = os.environ["EVENT_NAME"] == "schedule" or os.environ.get("FORCE_FULL") == "true"

          # Sharded 10 ways on every leg: an unsharded run of this suite does not finish inside the cap on
          # a 2-vCPU runner (the unsharded 3.14 leg timed out on effectively every push before 2026-08-18).
          GROUPS = [str(i) for i in range(1, 11)]
          # Mid-band, and the version whose wheels are most reliably published for macOS and Windows
          # alike. Read from the environment so the coverage gates below cannot name a different one.
          REPRESENTATIVE = os.environ["REPRESENTATIVE_PYTHON"]
          ALL_VERSIONS = ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]

          if full:
              legs = [
                  {"os": os_name, "python-version": v, "splits": "10", "group": g,
                   # 3.14 and the non-Linux platforms stay non-blocking: cp314 wheels are still landing,
                   # and mlframe has never had a green run on Windows or macOS, so the first sweeps are a
                   # survey rather than a gate. Drop the flag per-platform once one passes.
                   "experimental": v == "3.14" or os_name != "ubuntu-latest"}
                  for os_name in ("ubuntu-latest", "windows-latest", "macos-latest")
                  for v in ALL_VERSIONS
                  for g in GROUPS
              ]
          else:
              # TEMPORARY (audits/ci_review_2026-09-08/_TRACKER.md, X5): macOS-only push matrix while
              # iterating on the libomp/LightGBM crash fix -- ubuntu/windows dropped so each CI round
              # queues far fewer jobs and turns around faster. Revert to all three platforms once macOS
              # is confirmed stable across a few consecutive pushes.
              legs = [
                  {"os": os_name, "python-version": REPRESENTATIVE, "splits": "10",
                   "group": g, "experimental": False}
                  for os_name in ("macos-latest",)
                  for g in GROUPS
              ]

          print("matrix=" + json.dumps({"include": legs}))
          print("full=" + ("true" if full else "false"))
          PY

  test:
    name: pytest ${{ matrix.python-version }} on ${{ matrix.os }} (shard ${{ matrix.group }}/${{ matrix.splits || '10' }})
    runs-on: ${{ matrix.os }}
    # bash on every OS (it ships on the Windows runners too): every ``run:`` block below is POSIX
    # shell, and a Windows leg would otherwise default to pwsh and parse them differently.
    defaults:
      run:
        shell: bash
    env:
      # [tool.uv.sources] points pyutilz at git, while this job installs it from a local clone. uv sees
      # two different URLs for one package and refuses: "Requirements contain conflicting URLs for
      # package `pyutilz`". The source exists so `uv lock` can resolve a package that is not on PyPI;
      # here the clone is the intended input, so the table is ignored. Never set this on the lockfile
      # job -- that one needs the source to resolve at all.
      UV_NO_SOURCES: "1"
      # Persist numba's on-disk JIT cache across runs AND shards (see the cache step below). Without it numba
      # recompiles the ~430 cache=True kernels cold on every shard of every run; measured locally, ~80% of a
      # feature_selection test file's cold time is first-call compilation (64.6s cold -> 11.9s warm), which is
      # what pushed each shard past the 120-min cap. A persisted cache makes warm shards ~5x faster to compile.
      NUMBA_CACHE_DIR: ${{ github.workspace }}/.numba-cache
    # A GitHub-hosted runner has only 2 vCPUs and the suite is large. Two costs dominate per shard: numba
    # cold-JIT compilation (now cached across runs+shards via NUMBA_CACHE_DIR) and model-training tests. We
    # shard 10 ways via pytest-split (`--splits 10 --group N`) so even a cold shard (which must populate the
    # cache) finishes under the cap; warm shards are far faster. timeout-minutes is headroom, not a budget.
    # Raised 120->240 (2026-08-08): the 2026-08-08 run on 6bb8b05be lost 21/41 shards to this cap mid-suite
    # (each killed at exactly ~120m16s, confirmed via job started_at/completed_at) -- those shards' real
    # pass/fail results were never reported, only "cancelled". 240 gives even the slowest cold biz_val-heavy
    # shard room to actually finish and report its real failures instead of being silently truncated.
    # Raised 240->360 (2026-08-15): run 31779046280 (2026-08-14) lost shard 3/8 to this exact cap again,
    # killed at exactly 4h00m00s -- 360 is GitHub Actions' own hard ceiling for hosted runners (cannot go
    # higher). This is a headroom bump, NOT a fix: repeatedly raising this cap after each incident treats
    # the symptom. The likely root cause (not yet confirmed from a full shard log at the time of this
    # change) is a test blocked inside a native call (xgboost's C booster update, joblib's threaded
    # _retrieve poll loop, cupy's blocking .get() H2D sync) that pytest-timeout's `method=thread` cannot
    # actually interrupt -- it marks the test timed-out for reporting but the underlying thread keeps
    # running, so the whole worker process hangs until something external (this job cap) kills it,
    # 8->16 splits (2026-08-15): the REAL fix for the repeated cap incidents above -- a cancelled shard
    # never reaches pytest's session-finish hook, so `--store-durations` (below) never writes anything for
    # it, so `merge-test-durations` never receives real timing data for exactly the heaviest shards --
    # a bootstrapping deadlock (file-count sharding stays unbalanced forever because the shards it
    # unbalances the worst are the ones that get killed before they can report real durations to fix it).
    # Halving average per-shard workload breaks the deadlock: even badly-imbalanced shards should now
    # finish inside the cap, start reporting real durations, and let `merge-test-durations` self-correct
    # the balance on every subsequent push.
    # 16->10 splits (2026-08-15, same day): 16 shards x 5 required python versions + the 3.14 smoke job
    # = 86 concurrent jobs, well past this account's free-tier concurrent-runner cap -- run 31839758990
    # still had ~40 jobs stuck `queued` 1h30m+ in, with py3.13/3.14 never starting. 10 shards keeps the
    # bootstrapping-deadlock fix (a cold shard still finishes well inside the 360m cap) while cutting
    # total jobs to 54, small enough to mostly avoid queueing under the same free-tier limit. Revisit
    # if shards start getting cancelled again (raise back toward 16) or if queueing is still severe at
    # 10 (drop further, or split the matrix so not every python version runs on every push).
    # 3.14 sharded 10 ways (2026-08-18, see the `include` block below): raises the matrix from 51 to 60
    # jobs (5 required versions x 10 + 3.14 x 10, vs. 5x10 + 1 unsharded). Still well under the ~86-job
    # threshold that caused the queueing incident above; revisit together with the note above if queueing
    # reappears.
    # silently eating every remaining test in that shard. If shards keep hitting 360 after this bump,
    # the fix is finding and isolating that specific hang (or switching CI's timeout method to
    # `signal` on Linux, which can actually preempt a blocked syscall), not raising the cap further --
    # there is no higher cap to raise to.
    timeout-minutes: 360
    # Newest-Python rows are marked experimental so a single optional-extra
    # that has not yet published a cp314 wheel does not turn a required check
    # red while the ecosystem finishes catching up. The core stack (numpy /
    # numba / polars / sklearn / pyarrow / pydantic) already ships cp314 wheels.
    continue-on-error: ${{ matrix.experimental || false }}
    needs: matrix-setup
    strategy:
      fail-fast: false
      # Built by matrix-setup from the triggering event: the representative Linux leg on a push, every
      # OS and version on the weekly sweep. See that job for why the two cadences differ.
      matrix: ${{ fromJSON(needs.matrix-setup.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      # The [all,dev] extras union resolves to a ~5 GB, several-hundred-package
      # graph (torch / mlflow / lightning / gpytorch / pysr+julia / ...). pip's
      # backtracking resolver hits `error: resolution-too-deep` on this graph
      # (py3.13/3.14) and, where it does resolve, the install alone burns ~25 min
      # of the 90-min job budget so install+test overruns the cap. uv's resolver
      # has no depth ceiling and installs in parallel (~10x faster), fixing both.
      # LightGBM's macOS wheel links against @rpath/libomp.dylib and does not bundle it, so importing
      # lightgbm raises OSError until the OpenMP runtime is on disk. Nothing in the Python dependency
      # graph can supply it -- it is a system library, and the macOS images do not ship one. Measured on
      # mlframe's first macOS run (2026-09-08): 375 test files failed to COLLECT, every one of them on
      # this single dlopen, with no actual test failures behind it.
      #
      # Homebrew's prefix (/opt/homebrew/opt/libomp/lib) is already one of the paths the dylib searches,
      # so installing it is the whole fix -- no DYLD_LIBRARY_PATH needed.
      - name: Install the OpenMP runtime LightGBM needs (macOS only)
        if: runner.os == 'macOS'
        run: brew install libomp

      - name: Set up uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990  # v8.3.2
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml

      # pyutilz is a first-party sibling dep not yet on PyPI: clone it and install from the local path so
      # mlframe's `pyutilz>=1.0.0` resolves to it (mlframe requires plain pyutilz, no extras, so the explicit
      # ./pyutilz[...] target fully controls pyutilz's extras). Install the narrow pyutilz extras -- EXCLUDING
      # [nlp] (spacy>=3.0 -> thinc>=8.3.12 needs py>=3.10, and the matrix still covers py3.9) -- and mlframe's
      # [all,dev] union (mlframe's submodules have unguarded top-level heavy imports, so [all] keeps test
      # collection from blowing up on ModuleNotFoundError) in a SINGLE `uv pip install`. Extracted 2026-07-18
      # to py-ci-shared's install-pyutilz composite action -- this exact clone+uv-install pair was
      # duplicated near-verbatim across 6 workflows in this repo.
      - uses: fingoldo/py-ci-shared/.github/actions/install-pyutilz@71957762ddd99200a66e3312a8ef9293b4c5d939  # v1.4.0
        with:
          pyutilz-extras: "system,pandas,polars,database"
          project-extras: ".[all,dev]"
          # This was the ONLY pyutilz-cloning workflow in the repo with no actual pin (the action
          # itself had no way to honour one until pyutilz-ref was added) -- every other workflow's
          # inline "git -C pyutilz checkout <sha>" line already matched this SHA; see
          # X_CICD_DEPENDENCIES-1 for why pinning matters here.
          pyutilz-ref: 960399fafa8e72c536b25a9cbace0b302688a968  # pragma: allowlist secret -- git commit SHA, not a secret

      - name: Install contributor tooling not declarable in [dev]
        run: |
          # py-ci-shared is a git checkout, so it cannot live in [dev] without putting a PEP 440 direct
          # reference into the built distribution's metadata (see requirements-dev.txt). It is still needed
          # here: tests/test_meta/conftest.py imports py_ci_shared at collection time, so without it every
          # shard that collects tests/test_meta errors out before running anything.
          uv pip install --system -r requirements-dev.txt

      - name: Restore numba JIT cache
        # numba's per-kernel disk cache (keyed internally by source + numba version) is restored into
        # NUMBA_CACHE_DIR so warm shards skip recompilation. The exact key hits when src is unchanged; the
        # restore-keys prefix falls back to the newest prior cache (numba then recompiles only changed kernels,
        # so a stale restore is still a large net win). All shards of one (os, python) share the key, so the
        # first to finish populates it for the rest. Save happens in the post-job step.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ github.workspace }}/.numba-cache
          key: numba-${{ runner.os }}-py${{ matrix.python-version }}-${{ hashFiles('src/**/*.py') }}
          restore-keys: |
            numba-${{ runner.os }}-py${{ matrix.python-version }}-

      - name: Show installed versions
        run: |
          python -c "import mlframe; print('mlframe', mlframe.__version__)"
          python -c "import sklearn; print('sklearn', sklearn.__version__)"
          python -c "import numpy; print('numpy', numpy.__version__)"

      - name: Run tests
        env:
          PYTHONUNBUFFERED: "1"
          # Heavily-parametrised modules (multi-seed sweeps, binning-method grids) collapse to one
          # representative variant per code path via tests/conftest.py's fast_subset() -- the exhaustive
          # sweep is meant to run behind this flag being UNSET (a slow/nightly leg), not on every PR.
          # This was never wired into any workflow, so every push paid the full N-seed matrix; several of
          # the top-200 slowest CI tests were the same test re-run 3x across seeds with no CI job ever
          # covering the flag-off (exhaustive) path either. Fast mode still exercises every code path,
          # just with 1 representative value instead of N.
          MLFRAME_FAST: "1"
          # Passed as environment variables rather than interpolated into the script text. They come
          # from matrix-setup's OUTPUT now, not from a literal matrix block, and a ${{ }} expansion of
          # a job output is substituted into the shell source before it runs -- which is what zizmor's
          # template-injection audit flags. Read as $SHARD_SPLITS / $SHARD_GROUP they stay data.
          SHARD_SPLITS: ${{ matrix.splits || '10' }}
          SHARD_GROUP: ${{ matrix.group }}
          # pytest-timeout's default `thread` method cannot interrupt a test blocked inside a native call:
          # it reports the timeout while the underlying thread keeps running, so the worker hangs until the
          # job cap kills the whole shard and its real results are never reported -- the mechanism the long
          # note above names as the likely cause of the repeated cap incidents. `signal` (SIGALRM, POSIX
          # only, hence the per-OS value) raises inside the worker instead and can preempt those native
          # calls that return to the interpreter.
          # Linux ONLY, not all of POSIX. The finding this implements named Linux specifically; extending
          # it to macOS brought back the `Fatal Python error: Aborted` crashes that this repo had already
          # driven to zero -- SIGALRM delivered into a thread doing native numba/multiprocessing work
          # aborts the process there rather than raising. Windows has no SIGALRM at all.
          TIMEOUT_METHOD: ${{ runner.os == 'Linux' && 'signal' || 'thread' }}
          # macOS only: `-n auto` on this runner measured 3 real xdist WORKER PROCESSES, not the 2 this
          # job's own long-standing OOM note assumed -- each one imports the full mlframe/numpy/pandas/
          # sklearn/lightgbm/xgboost/catboost/torch/numba stack (a real, sizeable RSS on its own) before
          # running a single test, so 3 of them on a 7GB host leaves little headroom before any test even
          # allocates real data. CI (run 34678887789) still lost shards 2/3/5 to the exact "node down: Not
          # properly terminated" whole-host OOM signature AFTER test_core.py's exclusion (below) and the 3
          # prior targeted per-test mitigations that comment already lists -- a lever aimed at a SPECIFIC
          # test class cannot fix a baseline-import-footprint problem. Capping to 2 workers is a new,
          # different lever: fewer resident full-stack processes, not less concurrency within one. Linux/
          # Windows keep `auto` -- their runners are not the ones OOM-killing.
          XDIST_WORKERS: ${{ matrix.os == 'macos-latest' && '2' || 'auto' }}
          JUNIT_XML: junit-${{ matrix.os }}-${{ matrix.python-version }}-${{ matrix.group }}.xml
        run: |
          # --dist=loadgroup: plain `-n auto` defaults to `--dist=load`, which does NOT honor
          # `@pytest.mark.xdist_group(...)` -- every group pin in the suite (GPU tests, the
          # kernel-tuning-cache singleton tests, the CatBoost-fit OOM-avoidance pins) was silently a
          # no-op under the old distmode, confirmed by grouped tests still landing on different
          # workers/crashing concurrently despite the marker. loadgroup keeps the worker count and
          # load-balancing `-n` picks, it only additionally pins same-group tests to one worker.
          # tests/training/test_core.py is EXCLUDED here and run separately by test-heavy-serial
          # below (-n 1, no xdist at all): even with its two classes already xdist_group-pinned to
          # one worker, CI still recurrently OOM-killed the runner ("node down: Not properly
          # terminated" -- the whole-host OOM-kill signature, not a per-worker one) because -n
          # auto on this 7GB macOS runner still starts OTHER workers for the rest of the shard's
          # tests, and their own memory use stacks with the pinned group's on the same host.
          # xdist_group only serializes tests WITHIN the group against each other: it cannot stop a
          # completely different worker from running concurrently. Confirmed this isn't a fixable
          # per-test issue -- 3 prior targeted mitigations (worker-pinning both heavy classes
          # together, matplotlib/gc cleanup between tests, capping CatBoost's own thread_count) all
          # already landed here and the crash still recurred with all three in place, which only
          # makes sense as inter-worker host memory pressure, not anything local to this file.
          # Excluding it from every macOS shard removes ONE source of that pressure; XDIST_WORKERS
          # (above) removes another, independent one -- the worker COUNT itself.
          pytest -m "not slow and not gpu and not multigpu" \
            --splits "$SHARD_SPLITS" --group "$SHARD_GROUP" \
            --ignore=tests/training/test_core.py \
            -n "$XDIST_WORKERS" \
            --dist=loadgroup \
            --cov=src/mlframe \
            --cov-report=xml \
            --cov-report=term-missing \
            -p no:randomly \
            --timeout=900 \
            --timeout-method="$TIMEOUT_METHOD" \
            --junitxml="$JUNIT_XML" \
            --durations=200 \
            --store-durations \
            --show-progress

      # `--store-durations` (above) merges this shard's freshly-measured durations into the
      # `.test_durations` this job's checkout started from (pytest-split reads+writes the same
      # default path), so each shard's local copy is [repo's checked-out durations] UNION [this
      # shard's own fresh subset]. Uploaded per-shard so merge-test-durations (below) can fold
      # every shard's fresh slice back into one file and commit it -- keeping pytest-split's
      # balancing data current on every push. `if: always()` so a shard that failed or hit
      # its timeout still contributes whatever durations it collected before that point.
      # `include-hidden-files: true` (2026-08-15): `.test_durations` is a dotfile -- actions/upload-artifact's
      # glob EXCLUDES hidden files by default, so despite pytest-split's own log confirming it wrote the file
      # every single time ("[pytest-split] Stored test durations in .../.test_durations"), this step logged
      # "No files were found with the provided path: .test_durations" on every shard, every run, since this
      # workflow was written -- root cause of `.test_durations` staying `{}` (seeded empty 2026-07-18) through
      # every subsequent "chore: refresh .test_durations" commit: merge-test-durations always downloaded 0
      # real shard artifacts to merge.
      # Thirty shard jobs with no machine-readable result anywhere meant diagnosing a red push was N log
      # dives through a 35k-test suite. The report-tests job below folds these into one table.
      - name: Upload shard JUnit report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: junit-${{ matrix.os }}-${{ matrix.python-version }}-${{ matrix.group }}
          path: junit-*.xml
          include-hidden-files: false

      - name: Upload shard test durations
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          # The OS belongs in the name. A push runs three platforms on ONE Python version, so without it
          # all three shard-N jobs ask for the same artifact name, and upload-artifact rejects a duplicate
          # as a non-retryable conflict -- two of every three jobs would fail on a step that has nothing to
          # do with their tests. It also keeps macOS timings from overwriting Linux ones in the file that
          # balances all three platforms.
          name: test-durations-${{ matrix.os }}-${{ matrix.python-version }}-${{ matrix.group }}
          path: .test_durations
          retention-days: 3
          include-hidden-files: true
          if-no-files-found: ignore

      - name: Upload coverage to Codecov
        uses: fingoldo/py-ci-shared/.github/actions/upload-codecov@f50288e5a6f5b7f972efb60f948ce6184c8e9e70  # v1.3.4
        # (success() || failure()): a test failure in this shard (even one unrelated to coverage, e.g. a
        # meta-test) otherwise skips this step by GitHub Actions' default "only if prior steps succeeded"
        # rule, so codecov never sees that shard's coverage.xml and the merged report stays incomplete --
        # observed as the badge never updating despite runs completing.
        if: matrix.python-version == env.REPRESENTATIVE_PYTHON && matrix.os == env.COVERAGE_OS && (success() || failure())
        with:
          files: ./coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}

      # Raw sqlite `.coverage` (not the derived coverage.xml above) so codecov-full.yml can
      # `coverage combine` this shard's data with numba-coverage-nightly's shards into one
      # genuinely unioned line-coverage report -- summing the two flags' already-published
      # percentages double-counts every line both jobs happen to exercise, which is most of the
      # codebase (see the "codecov" + "codecov-numba" badges' own docs for why they can't just be
      # added together). `.coverage` is a dotfile -- same upload-artifact hidden-file gotcha as
      # `.test_durations` above.
      - name: Upload raw coverage data (for the cross-workflow merged report)
        if: matrix.python-version == env.REPRESENTATIVE_PYTHON && matrix.os == env.COVERAGE_OS && (success() || failure())
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: raw-coverage-ci-${{ matrix.group }}
          path: .coverage
          retention-days: 3
          include-hidden-files: true
          if-no-files-found: ignore

  # Dedicated, always-serial (-n 1, no xdist) home for tests/training/test_core.py -- excluded from
  # every -n auto shard above for the reason documented at that exclusion's own comment: its two
  # xdist_group-pinned CatBoost-heavy classes kept OOM-killing the host even after 3 prior targeted
  # mitigations, because -n auto's SECOND worker (running the rest of that shard) still stacks its
  # own memory use against the pinned group's on the same 2-vCPU/7GB runner. Running the whole file
  # with no second worker at all removes that stacking entirely.
  # Split into 4 groups via pytest-split (--group matrix axis below): even with -n 1 (zero worker
  # stacking), running all ~128 tests in ONE long-lived process still crashed with "worker 'gw0'
  # crashed" (real OOM, not a stacking artifact -- confirmed 2026-08-23, python 3.10/3.11, failing
  # near the END of a 35min/115-tests-passed run) from cumulative per-process memory growth across
  # that many CatBoost/polars fits, not any single test's footprint. A first fix (2 groups, ~60
  # tests each) was STILL insufficient -- confirmed 2026-08-23 on python 3.12, group 2/2 crashed
  # TWICE in one run (TestTextAndEmbeddingFeatures again both times), proving the recurring offender
  # class's per-test memory footprint alone is large enough that even a 60-test subset accumulates
  # past the 7GB budget, not just a slow leak across the WHOLE file. Four groups (~26 tests each)
  # gives every runner process a smaller cumulative-growth ceiling before hitting the budget. 3.14
  # is excluded from the python-version axis (experimental leg, same reasoning as the main matrix's
  # own 3.14 rows).
  test-heavy-serial:
    env:
      # [tool.uv.sources] points pyutilz at git, while this job installs it from a local clone. uv sees
      # two different URLs for one package and refuses: "Requirements contain conflicting URLs for
      # package `pyutilz`". The source exists so `uv lock` can resolve a package that is not on PyPI;
      # here the clone is the intended input, so the table is ignored. Never set this on the lockfile
      # job -- that one needs the source to resolve at all.
      UV_NO_SOURCES: "1"
    name: pytest ${{ matrix.python-version }} on ubuntu-latest (test_core.py, serial, group ${{ matrix.group }}/4)
    needs: matrix-setup
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # One version on a push, the same one the main matrix uses -- a push varies the PLATFORM and
        # holds the version fixed, and that applies here too. This job ran the full 3.9-3.13 spread until
        # 2026-09-08, which put four extra Python versions on every push for one file.
        #
        # test_core.py still gets its own job rather than joining the sharded matrix: it is the file that
        # recurrently OOM-killed the runner, so it runs serially, alone, on Linux.
        #
        # The weekly sweep is where the version axis is covered, for this file along with everything else.
        python-version: ["${{ needs.matrix-setup.outputs.representative_python }}"]
        group: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990  # v8.3.2
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml

      - uses: fingoldo/py-ci-shared/.github/actions/install-pyutilz@71957762ddd99200a66e3312a8ef9293b4c5d939  # v1.4.0
        with:
          pyutilz-extras: "system,pandas,polars,database"
          project-extras: ".[all,dev]"
          pyutilz-ref: 960399fafa8e72c536b25a9cbace0b302688a968  # pragma: allowlist secret -- git commit SHA, not a secret

      - name: Restore numba JIT cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ github.workspace }}/.numba-cache
          key: numba-${{ runner.os }}-py${{ matrix.python-version }}-${{ hashFiles('src/**/*.py') }}
          restore-keys: |
            numba-${{ runner.os }}-py${{ matrix.python-version }}-

      - name: Run tests/training/test_core.py (serial, group ${{ matrix.group }}/4)
        env:
          PYTHONUNBUFFERED: "1"
          NUMBA_CACHE_DIR: ${{ github.workspace }}/.numba-cache
          MLFRAME_FAST: "1"
        run: |
          pytest tests/training/test_core.py \
            -m "not slow and not gpu and not multigpu" \
            --splits 4 --group ${{ matrix.group }} \
            -n 1 \
            -p no:randomly \
            --timeout=900 \
            --timeout-method=signal \
            --junitxml=junit-heavy-serial-${{ matrix.group }}.xml \
            --durations=200 \
            --no-cov \
            --show-progress

  # Folds every shard's freshly-measured `.test_durations` slice (uploaded above) back into one
  # file and commits it to master, so pytest-split's shard balancing stays current on every push. This
  # is the only path that maintains the file; the separate weekly full-suite update-test-durations.yml
  # it superseded was deleted 2026-09-08, never having reached its commit step once. Root cause: `.test_durations` was seeded empty 2026-07-18 and never
  # successfully repopulated since, so pytest-split silently fell back to file-count balancing --
  # one shard (observed: py3.10/py3.12 group 3) collecting a disproportionate share of the
  # heaviest biz_val/MRMR fits and running 30-40+ min longer than its siblings on every run, with
  # no per-test bug to fix (the imbalance was in the split data, not the tests). Push-only (not
  # PR): a PR's merge commit isn't on master yet, and mutating a fork/PR branch here would be
  # both wrong (branch doesn't own this data) and blocked by the read-only token PRs get anyway.
  merge-test-durations:
    name: Merge + commit .test_durations
    # Shared with numba-coverage.yml's commit job: both push .test_durations-family files to master, and
    # serialising them removes the interleaving that the rebase-and-retry below would otherwise have to
    # absorb. Never cancel-in-progress -- a cancelled push loses the run's measurements entirely.
    concurrency:
      group: test-durations-commit
      cancel-in-progress: false
    runs-on: ubuntu-latest
    needs: test
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/master'
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: true

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          # One platform only. Shard timings differ substantially between Linux, Windows and macOS, and
          # the merge below is last-write-wins per node id, so mixing them makes the balancing file a
          # non-reproducible blend of whichever OS happened to upload last. Balance on the platform the
          # coverage leg already treats as canonical; the other two still run every shard.
          pattern: test-durations-${{ env.COVERAGE_OS }}-*
          path: .test_durations_shards
          merge-multiple: false

      - name: Merge shard durations
        run: |
          python - <<'PY'
          import json
          import pathlib

          merged = {}
          # Sorted for deterministic merge order. Last-write-wins on a node id measured by more than one
          # matrix leg; with the download narrowed to a single OS the remaining axis is python version,
          # where either value is a valid balancing input and determinism just keeps diffs reviewable.
          for f in sorted(pathlib.Path(".test_durations_shards").glob("*/.test_durations")):
              try:
                  merged.update(json.loads(f.read_text()))
              except (json.JSONDecodeError, OSError):
                  continue
          pathlib.Path(".test_durations").write_text(json.dumps(merged, sort_keys=True, indent=4))
          print(f"[merge-test-durations] merged {len(merged)} entries")
          PY

      # Uploads happen on `if: always()` so a red run's timings are still inspectable, but committing
      # them is different: a run where most shards were cancelled at the job cap yields a merged file
      # built from partial data, and since the merge is dict.update that lands a strictly worse balancing
      # file than its parent. Commit only from a run where every shard actually finished.
      - name: Commit updated .test_durations
        if: needs.test.result == 'success'
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- .test_durations; then
            echo "No change to .test_durations"
            exit 0
          fi
          git add .test_durations
          git commit -m "chore: refresh .test_durations (post-CI shard rebalance)"
          # This repo pushes often enough that master routinely moves between this job's checkout and its
          # push. Without a rebase that is a non-fast-forward rejection and a red job over a chore commit.
          for attempt in 1 2 3; do
            if git push origin HEAD:"$REF_NAME"; then
              exit 0
            fi
            echo "push rejected (attempt $attempt), rebasing onto $REF_NAME"
            git pull --rebase --autostash origin "$REF_NAME"
          done
          echo "could not land .test_durations after 3 attempts"
          exit 1

  # Blocking gate + advisory bundle, both extracted to fingoldo/py-ci-shared reusable workflows
  # (2026-07-09) since their logic is identical across mlframe/pyutilz -- see
  # https://github.com/fingoldo/py-ci-shared and this repo's pyproject.toml `[tool.ruff] extend`.
  #
  # None of these call sites restate `permissions:` -- a workflow_call job's permissions are
  # CAPPED BY, not additive to, the caller's own top-level `permissions: contents: read` (line 23
  # above); the reusable workflow can request more but never actually receive more than what this
  # file grants. Confirmed against GitHub's own reusable-workflow permissions docs (2026-07-18
  # architecture review) -- not an oversight, restating `contents: read` at each call site would
  # be redundant, not safer.
  ruff-blocking:
    name: Ruff (real bugs - blocking)
    uses: fingoldo/py-ci-shared/.github/workflows/ruff-blocking.yml@915217a4a8cdecc60b67c2c6c8dfe81de2f8a91c  # v1
    with:
      ignore: "C901"

  lint-blocking:
    name: lint + security (blocking, triaged clean)
    uses: fingoldo/py-ci-shared/.github/workflows/lint-blocking.yml@64e2b6bab64414b8508dc05100a9421849a74a64  # v1 (adds per-tool version-pin inputs)
    with:
      source-path: src/mlframe
      codespell-paths: src/mlframe
      vulture-whitelist-path: scripts/vulture_whitelist.py
      interrogate-source-path: src/mlframe
      interrogate-fail-under: 100
      # The original ~37k-finding number (see [tool.deptry] comment) was itself an artifact of
      # running deptry without the project's real extras installed -- deptry's DEP001/DEP002/
      # DEP003 rules are meaningless in a bare environment (confirmed 2026-07-09: re-run with
      # [all,dev] actually installed via `python -m deptry .` surfaced exactly 1 real finding).
      deptry-install-command: |
        git clone https://github.com/fingoldo/pyutilz.git
        git -C pyutilz checkout 960399fafa8e72c536b25a9cbace0b302688a968  # see X_CICD_DEPENDENCIES-1 for why this is pinned -- narrowed code_audit scanners + the private-assertion-helper fix
        # UV_NO_SOURCES: [tool.uv.sources] points pyutilz at git while this line installs it from the
        # clone above; uv refuses on conflicting URLs for one package. A reusable-workflow call cannot
        # carry `env:`, so it goes on the command. Same reason as mypy-full.yml.
        UV_NO_SOURCES=1 uv pip install --system "./pyutilz[system,pandas,polars,database]" -e ".[all,dev]"
      run-zizmor: true
      # L1.1: pin every uvx-run tool this repo has an EXACT version for elsewhere, so `uvx TOOL`
      # here can't silently drift from the pin test_installed_tool_versions_match_their_exact_pins
      # already asserts for the pre-commit-hook / local-dev-environment copy of each tool. Sourced
      # from this repo's own [project.optional-dependencies].dev pins (codespell/yamllint/vulture/
      # interrogate) and .pre-commit-config.yaml's actionlint-py `rev:` (bandit and zizmor have no
      # exact pin anywhere in this repo yet, so they stay unpinned -- L3.3's own "measure, don't
      # guess" applies here too).
      actionlint-version: "1.7.12.24"
      codespell-version: "2.4.2"
      yamllint-version: "1.38.0"
      vulture-version: "2.16"
      interrogate-version: "1.7.0"

  lint-advisory:
    name: lint (advisory)
    uses: fingoldo/py-ci-shared/.github/workflows/lint-advisory.yml@915217a4a8cdecc60b67c2c6c8dfe81de2f8a91c  # v1
    with:
      source-path: src/mlframe
      # import-linter's two contracts are now real blocking meta-tests
      # (test_no_sibling_backimport_to_facade.py, test_no_inbound_edge_to_benchmarking.py); the
      # advisory job and the import-linter dev dependency were both removed.
      run-import-linter: false
      pydoclint-source-path: src/mlframe

  # tests/ is intentionally EXCLUDED from the src-scoped jobs above (root pyproject.toml's
  # [tool.ruff] / [tool.interrogate] both list "tests" in their exclude) -- it carries its own,
  # deliberately looser configs (tests/ruff.toml, tests/interrogate.toml) reached via a 2026-07-17
  # cleanup pass (rename, ruff format+fix, black, docstrings to 100%). These jobs gate that
  # subtree separately so it isn't silently unchecked; check-path/interrogate-config on the
  # reusable workflows (py-ci-shared v1.1.0+) point them at tests/ instead of the whole repo.
  tests-ruff-blocking:
    name: Ruff tests/ (real bugs - blocking)
    uses: fingoldo/py-ci-shared/.github/workflows/ruff-blocking.yml@915217a4a8cdecc60b67c2c6c8dfe81de2f8a91c  # v1
    with:
      check-path: tests
      ignore: "C901"

  tests-black-filtered:
    name: Black tests/ (filtered, blocking)
    uses: fingoldo/py-ci-shared/.github/workflows/black-filtered.yml@915217a4a8cdecc60b67c2c6c8dfe81de2f8a91c  # v1
    with:
      check-path: tests

  tests-lint-blocking:
    name: lint + security tests/ (blocking)
    uses: fingoldo/py-ci-shared/.github/workflows/lint-blocking.yml@64e2b6bab64414b8508dc05100a9421849a74a64  # v1 (adds per-tool version-pin inputs)
    with:
      source-path: tests
      codespell-paths: tests
      vulture-whitelist-path: tests/vulture_whitelist.py
      interrogate-source-path: tests
      interrogate-config: tests/interrogate.toml
      # deptry is project-wide (installed deps are the same regardless of which tree imports
      # them) and already checked once by lint-blocking above -- running it again here would
      # just duplicate that result, not add coverage.
      deptry-install-command: ""
      # zizmor scans .github/workflows/ regardless of source-path -- already covered by the
      # src-scoped lint-blocking job above; skip the duplicate run here.
      run-zizmor: false
      # L1.1: same pins as the src-scoped lint-blocking job above -- one tool version regardless
      # of which tree it's scanning.
      actionlint-version: "1.7.12.24"
      codespell-version: "2.4.2"
      yamllint-version: "1.38.0"
      vulture-version: "2.16"
      interrogate-version: "1.7.0"

  build:
    name: build sdist + wheel + install smoke
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          # The same single version everything else on a push uses, rather than a second one named here.
          python-version: ${{ env.REPRESENTATIVE_PYTHON }}

      - name: Set up uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990  # v8.3.2
        with:
          enable-cache: true

      - name: Build distributions
        run: uv build

      - name: Verify distributions with twine
        run: uvx twine check dist/*

      # Install the BUILT wheel (not the editable checkout) into a clean venv
      # to confirm package layout, MANIFEST.in, py.typed, and __init__.py
      # exports are all wired so an end user's `pip install mlframe` works.
      - name: Install wheel + smoke import
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install --upgrade pip
          /tmp/smoke/bin/pip install "pyutilz @ git+https://github.com/fingoldo/pyutilz.git@960399fafa8e72c536b25a9cbace0b302688a968"
          /tmp/smoke/bin/pip install dist/*.whl
          # Assert every path declared in [tool.setuptools.package-data] actually shipped. py.typed drops
          # typing support; default_kernel_tuning.json and the infonet configs are read at runtime, and
          # include-package-data = false makes losing any of them completely silent.
          python - <<'PY'
          import glob
          import sys
          import zipfile

          names = set(zipfile.ZipFile(glob.glob("dist/*.whl")[0]).namelist())
          required = [
              "mlframe/py.typed",
              "mlframe/feature_selection/filters/default_kernel_tuning.json",
          ]
          missing = [r for r in required if r not in names]
          if not any(
              n.startswith("mlframe/feature_selection/filters/_vendored/infonet/configs/") and n.endswith(".yaml")
              for n in names
          ):
              missing.append("mlframe/feature_selection/filters/_vendored/infonet/configs/*.yaml")
          if missing:
              sys.exit("package-data missing from wheel: " + ", ".join(missing))
          print("package-data OK")
          PY
          /tmp/smoke/bin/python -c "import mlframe; print('mlframe', mlframe.__version__, 'at', mlframe.__file__)"
          /tmp/smoke/bin/python -c "from mlframe.metrics.core import *; from mlframe.training import train_and_evaluate_model; from mlframe.models.ensembling import *; from mlframe.calibration.quality import *; print('smoke OK')"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: dist
          path: dist/
          retention-days: 14

  # Single aggregation point for branch-protection required status checks: the actual gating
  # jobs above are a python-version x shard matrix (currently 5x10) plus several reusable-workflow
  # calls, so their individual check names churn whenever the matrix is resized -- listing them all
  # as required checks would go stale silently. This job's own fixed name is the one required check;
  # `if: always()` lets it run even after an upstream failure so it can report that failure itself
  # rather than being skipped (a skipped required check blocks merge same as a failed one, but with
  # no clear reason in the PR UI). lint-advisory is intentionally excluded -- it's advisory by design
  # (see lint-advisory.yml), never a merge gate.
  # One readable table instead of opening thirty shard logs. Never gates anything (it is deliberately
  # absent from ci-required's needs): its only job is to make a red push diagnosable at a glance.
  report-tests:
    name: Test failure summary
    runs-on: ubuntu-latest
    needs: test
    if: always()
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          pattern: junit-*
          path: junit
          merge-multiple: false

      - name: Render summary
        run: |
          python - <<'PY'
          import os
          import pathlib
          import xml.etree.ElementTree as ET

          rows = []
          failures = []
          for f in sorted(pathlib.Path("junit").rglob("*.xml")):
              try:
                  root = ET.parse(f).getroot()
              except ET.ParseError:
                  rows.append((f.parent.name, "unparseable", "", "", ""))
                  continue
              suites = root.iter("testsuite") if root.tag == "testsuites" else [root]
              tot = fail = err = skip = 0
              for su in suites:
                  tot += int(su.get("tests", 0))
                  fail += int(su.get("failures", 0))
                  err += int(su.get("errors", 0))
                  skip += int(su.get("skipped", 0))
              rows.append((f.parent.name, tot, fail, err, skip))
              for case in root.iter("testcase"):
                  for kind in ("failure", "error"):
                      bad = case.find(kind)
                      if bad is not None:
                          nodeid = f"{case.get('classname', '')}::{case.get('name', '')}"
                          failures.append((f.parent.name, kind, nodeid, (bad.get("message") or "").strip()))

          out = []
          if not rows:
              out.append("No JUnit reports were uploaded -- every shard died before pytest wrote one.")
          else:
              out.append("| shard | tests | failures | errors | skipped |")
              out.append("|---|---:|---:|---:|---:|")
              for r in rows:
                  out.append("| " + " | ".join(str(x) for x in r) + " |")
              out.append("")
              out.append(f"**{len(failures)} failing test(s)** across {len(rows)} shard report(s).")
          if failures:
              out.append("")
              out.append("| shard | kind | test | message |")
              out.append("|---|---|---|---|")
              for shard, kind, nodeid, msg in failures[:200]:
                  msg = msg.replace("|", "\\|").splitlines()[0][:160] if msg else ""
                  out.append(f"| {shard} | {kind} | `{nodeid}` | {msg} |")
              if len(failures) > 200:
                  out.append("")
                  out.append(f"...and {len(failures) - 200} more; see the shard logs.")

          text = "\n".join(out)
          print(text)
          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary:
              with open(summary, "a", encoding="utf-8") as fh:
                  fh.write("## Test results\n\n" + text + "\n")
          PY

  # The suite runs on three platforms but the wheel was only ever installed on one, so a package-data or
  # path-handling regression could only be caught by a user. The wheel itself is pure Python and identical
  # across platforms, so it is built once above and only the install is matrixed here.
  install-smoke:
    name: install wheel on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    needs: build
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: dist
          path: dist

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ env.REPRESENTATIVE_PYTHON }}

      - name: Install wheel + smoke import
        run: |
          python -m venv smoke
          # A venv puts its interpreter in Scripts/ on Windows and bin/ everywhere else; the workflow runs
          # bash on all three runners, so only this one path segment has to vary.
          if [ "$RUNNER_OS" = "Windows" ]; then BIN=smoke/Scripts; else BIN=smoke/bin; fi
          "$BIN/python" -m pip install --upgrade pip
          "$BIN/pip" install "pyutilz @ git+https://github.com/fingoldo/pyutilz.git@960399fafa8e72c536b25a9cbace0b302688a968"
          "$BIN/pip" install dist/*.whl
          "$BIN/python" -c "import mlframe; print('mlframe', mlframe.__version__, 'at', mlframe.__file__)"
          "$BIN/python" -c "from mlframe.metrics.core import *; from mlframe.training import train_and_evaluate_model; from mlframe.models.ensembling import *; from mlframe.calibration.quality import *; print('smoke OK')"

      # In-repo mypy sees the source tree; a downstream user sees only the wheel plus py.typed. A public
      # signature annotated with a name that is not exported, or that only resolves under TYPE_CHECKING,
      # type-checks here and breaks every consumer. Advisory: it depends on stub availability in a bare
      # env, which is not this repo's to guarantee.
      - name: Type-check the public surface from a consumer position
        if: runner.os == 'Linux'
        continue-on-error: true
        run: |
          BIN=smoke/bin
          "$BIN/pip" install "mypy==2.1.0"
          cat > consumer.py <<'PY'
          import mlframe
          from mlframe.calibration.quality import *  # noqa: F403
          from mlframe.metrics.core import *  # noqa: F403
          from mlframe.models.ensembling import *  # noqa: F403
          from mlframe.training import train_and_evaluate_model

          print(mlframe.__version__, train_and_evaluate_model)
          PY
          "$BIN/python" -m mypy --ignore-missing-imports consumer.py

  # uv.lock is only worth having if it cannot silently fall out of step with pyproject.toml. `uv lock
  # --check` re-resolves and fails if the lock would change, which is the whole gate: edit a dependency
  # without re-locking and this job says so, in seconds, instead of the lock quietly describing a graph
  # nobody installs any more.
  #
  # It also proves the lock is INSTALLABLE, not merely resolvable. Those are different: the first lock
  # written here resolved cleanly and then failed `uv sync` on 3.13, because a single range-shaped
  # environment made the resolver pick the last torch with cp39 wheels for every version at once.
  lockfile:
    name: uv.lock is current and installable
    runs-on: ubuntu-latest
    needs: matrix-setup
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ env.REPRESENTATIVE_PYTHON }}

      - name: Set up uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990  # v8.3.2
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Lock is in step with pyproject.toml
        run: uv lock --check

      # --extra all is the set a contributor actually installs; the CUDA extras stay out because they are
      # deliberately outside [all] and their wheels are not fetchable on a hosted runner.
      - name: Lock installs, and what it installs imports
        run: |
          uv sync --frozen --extra all --extra dev
          uv run --frozen python -c "import mlframe; print('mlframe', mlframe.__version__)"
          uv run --frozen python -c "from mlframe.metrics.core import *; from mlframe.training import train_and_evaluate_model; from mlframe.calibration.quality import *; print('import OK')"

  ci-required:
    name: CI required checks
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # matrix-setup is in this list deliberately. Everything below it is `needs:`-dependent on it, so if it
    # fails every test job SKIPS -- and a skip is not a failure, so without it here this gate reported
    # green having run zero tests. That is the worst possible outcome for a required check.
    needs: [matrix-setup, test, test-heavy-serial, ruff-blocking, lint-blocking, tests-ruff-blocking, tests-black-filtered, tests-lint-blocking, build, install-smoke, lockfile]
    steps:
      - name: Check all required jobs succeeded
        env:
          NEEDS_JSON: ${{ toJson(needs) }}
          # 'skipped' counts too, for the same reason: a required job that never ran has not passed.
          ANY_BAD: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}
        run: |
          echo "$NEEDS_JSON"
          if [[ "$ANY_BAD" == "true" ]]; then
            echo "One or more required jobs failed, was cancelled, or never ran."
            exit 1
          fi
