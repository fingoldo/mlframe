name: dependency floors

# Every dependency floor in pyproject.toml (`numpy>=...`, `scikit-learn>=...`, the hand-written CVE floors
# with PYSEC/GHSA identifiers in their comments) is a claim that mlframe works with that version. Nothing
# tested that claim: every CI install resolves the NEWEST compatible release, so a floor that no longer
# installs, no longer imports, or dropped an API mlframe still calls is invisible until a user with an
# older environment hits it. `uv pip install --resolution=lowest-direct` resolves each DIRECT dependency to
# its declared floor while letting transitive ones float, which is exactly what the floors assert.
#
# Weekly rather than per-push: floors move only when someone edits pyproject.toml, and a full lowest
# resolution can drag in old wheels that need building from source.
#
# Non-blocking by design (`continue-on-error`), for now. Some floors are known-optimistic and this job
# exists first to measure how many; turning it blocking is the follow-up once the count is zero.

on:
  schedule:
    # Monday 05:23 UTC. Off the hour: GitHub queues scheduled workflows account-wide.
    - cron: "23 5 * * 1"
  workflow_dispatch:
  pull_request:
    branches: [master]
    # Only when the declared dependency set itself changes -- that is the only edit that can move a floor.
    paths:
      - "pyproject.toml"
      - ".github/workflows/dep-floors.yml"

permissions:
  contents: read

concurrency:
  group: dep-floors-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # A CVE floor like `aiohttp>=3.14.1` or `tornado>=6.5.7` is a hand-written claim, with the advisory id in
  # a comment beside it, that this version is the first safe one. Nothing re-checks those claims: they were
  # true when written and go stale in silence. pip-audit already exists in the dev extra and runs in the
  # advisory bundle over the INSTALLED environment, which is a developer's machine rather than what the
  # project declares. This audits the locked graph instead -- the exact set uv.lock pins, which is what a
  # `uv sync --frozen` actually installs.
  #
  # Three things about the invocation are load-bearing, all learned by getting them wrong first:
  #   * `--extra all --extra dev`, because a bare `uv export` emits only the base group. That run reported
  #     42 packages and zero advisories, which reads as good news and is an artefact of the wrong scope.
  #   * `--no-deps`, because the export is already fully pinned and resolving it again is both pointless
  #     and fragile.
  #
  # The export is universal -- one file carrying every environment's pins behind PEP 508 markers -- and pip
  # evaluates those markers for the interpreter it runs on. That is why this job must stay on ubuntu with
  # the representative Python: audited on a different interpreter, the same file selects pins that have no
  # wheel there and the run dies on a resolution error rather than on a finding. (uv 0.11 has no
  # --python-platform on `export`, so the runner itself is the targeting.)
  #
  # Advisory. The current count is not zero -- there are open dependabot PRs carrying exactly these fixes
  # (aiohttp #27 has been open since August) -- so blocking now would red the schedule on known debt rather
  # than on a regression. Flip `continue-on-error` off once the backlog is merged and a run reads clean.
  audit:
    name: known CVEs in the locked graph (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990  # v8.3.2
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Export the locked graph for this runner
        run: |
          uv export --frozen --no-hashes --extra all --extra dev --no-emit-project \
            --format requirements-txt > locked.txt
          # pyutilz resolves from git and has no advisory feed to check against; it is first-party and
          # tracked by its own repository's CI.
          grep -v '^pyutilz @' locked.txt > locked-audit.txt
          wc -l < locked-audit.txt

      - name: pip-audit the locked graph
        run: |
          python -m pip install --disable-pip-version-check "pip-audit>=2.7"
          python -m pip_audit -r locked-audit.txt --no-deps --progress-spinner off

  lowest-direct:
    name: install + smoke at declared floors
    runs-on: ubuntu-latest
    timeout-minutes: 45
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          # The oldest supported interpreter, since that is where the oldest dependency releases still have
          # wheels; a floor that only resolves on 3.12 is not really a floor.
          python-version: "3.9"

      - name: Set up uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990  # v8.3.2
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml

      - name: Resolve every direct dependency to its floor
        run: |
          uv pip install --system --resolution=lowest-direct "pyutilz[system,pandas,polars,database] @ git+https://github.com/fingoldo/pyutilz.git@ec016b15e76e5582ba1a083c02b33029663c2296"
          uv pip install --system --resolution=lowest-direct -e ".[dev]"
          uv pip list

      - name: Import smoke
        run: |
          python -c "import mlframe; print('mlframe', mlframe.__version__)"
          python -c "from mlframe.metrics.core import *; from mlframe.training import train_and_evaluate_model; from mlframe.calibration.quality import *; print('import OK')"

      # A representative slice rather than the full suite: the question here is "do the floors work at all",
      # not "is the suite green on old versions", and the latter would cost hours weekly.
      - name: Fast test subset
        env:
          MLFRAME_FAST: "1"
          PYTHONUNBUFFERED: "1"
        run: |
          pytest tests/metrics tests/calibration \
            -m "not slow and not gpu and not multigpu" \
            -n auto \
            --no-cov \
            -p no:randomly \
            --timeout=900 \
            --timeout-method=signal \
            --durations=200
