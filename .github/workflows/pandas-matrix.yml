# Pandas-version matrix for the pandas-facing tests.
#
# uv.lock resolves one pandas version and pyproject.toml caps pandas below 3.0 because the code was never audited against it. This workflow runs the
# tests that touch pandas against the locked version, the first 3.x release, the newest release and whatever pip resolves today, once a day and
# whenever the dependency declarations change, so a pandas release is seen on its first day and the cap can be lifted on evidence.
#
# Selection is by name (-k pandas) over the feature-engineering and training suites, with the timing-ratio tests left to ci.yml.

name: pandas-matrix

on:
  schedule:
    - cron: "17 5 * * *"
  push:
    branches: [master]
    paths:
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/pandas-matrix.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    name: pandas ${{ matrix.pandas-version }} on py${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      NUMBA_CACHE_DIR: ${{ github.workspace }}/.numba-cache
      PYTHONUNBUFFERED: "1"
      MLFRAME_FAST: "1"
    strategy:
      fail-fast: false
      matrix:
        include:
          - {pandas-version: "2.3.3", python-version: "3.12"}   # the version uv.lock resolves
          - {pandas-version: "3.0.0", python-version: "3.12"}   # first 3.x release
          - {pandas-version: "3.0.6", python-version: "3.12"}   # newest release seen
          - {pandas-version: "latest", python-version: "3.12"}  # whatever pip resolves today, so the next release is seen on its first day

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Clone & install pyutilz (sibling dependency)
        # pyutilz is not on PyPI; the narrow extras mlframe transitively imports, as in sklearn-matrix-ci.yml.
        run: |
          git clone https://github.com/fingoldo/pyutilz.git
          git -C pyutilz checkout d64ac2c2a2cf121c24c8c093126fe8f9553f03a7
          pip install "./pyutilz[system,pandas,polars,database]"

      - name: Install mlframe and the test tooling
        # The union of extras the pandas-facing tests import at collection (boosting, calibration, polars_ext, db for zstandard, neural for lightning);
        # py-ci-shared is a git checkout no extra can declare (see requirements-dev.txt).
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[boosting,calibration,viz,signal,stats,sampling,unsupervised,polars_ext,db,neural,dev]"
          pip install -r requirements-dev.txt

      - name: Pin pandas to ${{ matrix.pandas-version }}
        # numpy stays below 2.5 on every leg: catboost 1.2.10 fails to import on 2.5.3 (ValueError in _catboost init), which is unrelated to pandas.
        # pyproject.toml still caps pandas below 3.0; the 3.x legs install over that cap on purpose, to find out what the cap is guarding against.
        env:
          PANDAS_VERSION: ${{ matrix.pandas-version }}
        run: |
          if [ "$PANDAS_VERSION" = "latest" ]; then
            pip install --upgrade pandas "numpy<2.5"
          else
            pip install "pandas==${PANDAS_VERSION}" "numpy<2.5"
          fi

      - name: Show installed versions
        run: |
          python -c "import polars; print('polars', polars.__version__)"
          python -c "import pandas; print('pandas', pandas.__version__)"
          python -c "import numpy; print('numpy', numpy.__version__)"
          python -c "import mlframe; print('mlframe', mlframe.__version__)"

      - name: Restore numba JIT cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ github.workspace }}/.numba-cache
          key: numba-pandasmatrix-${{ runner.os }}-py${{ matrix.python-version }}-${{ hashFiles('src/**/*.py') }}
          restore-keys: |
            numba-pandasmatrix-${{ runner.os }}-py${{ matrix.python-version }}-

      - name: Pandas-facing tests
        # Timing-ratio tests ("speedup") are left to ci.yml: with -n auto on a 4-core runner their ratios measure the neighbouring workers.
        run: |
          pytest tests/feature_engineering tests/training \
            -k "pandas and not speedup" \
            -m "not slow and not gpu and not multigpu" \
            --no-cov \
            -p no:randomly \
            -n auto \
            --timeout=900 \
            -v
