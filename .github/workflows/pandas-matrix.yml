# Pandas-version matrix for the pandas-facing tests.
#
# uv.lock resolves one pandas version and pyproject.toml caps pandas below 3.0 because the code was never audited against it. This workflow runs the
# tests that touch pandas against the locked version, the first 3.x release, the newest release and whatever pip resolves today, once a day and
# whenever the dependency declarations change, so a pandas release is seen on its first day and the cap can be lifted on evidence.
#
# Selection is by name (-k pandas) over the feature-engineering and training suites, with the timing-ratio tests left to ci.yml.

name: pandas-matrix

on:
  schedule:
    - cron: "17 5 * * *"
  push:
    branches: [master]
    paths:
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/pandas-matrix.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  plan:
    name: choose the pandas versions
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: Resolve the legs
        # The lowest locked version, the newest release of its major series and the newest release overall, each once (scripts/ci_version_matrix.py).
        id: plan
        run: |
          python -m pip install packaging
          python scripts/ci_version_matrix.py plan --package pandas --lock uv.lock --python 3.12 --github-output "$GITHUB_OUTPUT"

  test:
    name: pandas ${{ matrix.label }} on py${{ matrix.python-version }}
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      NUMBA_CACHE_DIR: ${{ github.workspace }}/.numba-cache
      PYTHONUNBUFFERED: "1"
      MLFRAME_FAST: "1"
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Clone & install pyutilz (sibling dependency)
        # pyutilz is not on PyPI; the narrow extras mlframe transitively imports, as in sklearn-matrix-ci.yml.
        run: |
          git clone https://github.com/fingoldo/pyutilz.git
          git -C pyutilz checkout d64ac2c2a2cf121c24c8c093126fe8f9553f03a7
          pip install "./pyutilz[system,pandas,polars,database]"

      - name: Install mlframe and the test tooling
        # The union of extras the pandas-facing tests import at collection (boosting, calibration, polars_ext, db for zstandard, neural for lightning);
        # py-ci-shared is a git checkout no extra can declare (see requirements-dev.txt).
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[boosting,calibration,viz,signal,stats,sampling,unsupervised,polars_ext,db,neural,dev]"
          pip install -r requirements-dev.txt

      - name: Pin pandas to ${{ matrix.version }}
        # numpy stays below 2.5 on every leg: catboost 1.2.10 fails to import on 2.5.3 (ValueError in _catboost init), which is unrelated to pandas.
        # pyproject.toml still caps pandas below 3.0; a 3.x leg installs over that cap on purpose, to find out what the cap is guarding against.
        env:
          PANDAS_VERSION: ${{ matrix.version }}
        run: |
          pip install "pandas==${PANDAS_VERSION}" "numpy<2.5"

      - name: Show installed versions
        run: |
          python -c "import polars; print('polars', polars.__version__)"
          python -c "import pandas; print('pandas', pandas.__version__)"
          python -c "import numpy; print('numpy', numpy.__version__)"
          python -c "import mlframe; print('mlframe', mlframe.__version__)"

      - name: Restore numba JIT cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ github.workspace }}/.numba-cache
          key: numba-pandasmatrix-${{ runner.os }}-py${{ matrix.python-version }}-${{ hashFiles('src/**/*.py') }}
          restore-keys: |
            numba-pandasmatrix-${{ runner.os }}-py${{ matrix.python-version }}-

      - name: Pandas-facing tests
        # Timing-ratio tests ("speedup") are left to ci.yml: with -n auto on a 4-core runner their ratios measure the neighbouring workers.
        run: |
          pytest tests/feature_engineering tests/training \
            -k "pandas and not speedup" \
            -m "not slow and not gpu and not multigpu" \
            --no-cov \
            -p no:randomly \
            -n auto \
            --timeout=900 \
            -v

  badge:
    name: update the pandas badge
    needs: [plan, test]
    if: ${{ always() && github.ref == 'refs/heads/master' && needs.plan.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: Publish the badge document to the badges branch
        # shields.io reads the JSON from raw.githubusercontent.com; keeping it on its own branch keeps badge updates out of master's history and CI.
        env:
          MATRIX: ${{ needs.plan.outputs.matrix }}
          RESULT: ${{ needs.test.result }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          python -m pip install packaging
          python scripts/ci_version_matrix.py badge --package pandas --legs "$MATRIX" --result "$RESULT" --out "$RUNNER_TEMP/pandas.json"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          remote="https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"
          if git ls-remote --exit-code --heads "$remote" badges > /dev/null; then
            git fetch --depth=1 "$remote" badges
            git checkout -B badges FETCH_HEAD
          else
            git checkout --orphan badges
            git rm -rf --quiet .
          fi
          cp "$RUNNER_TEMP/pandas.json" pandas.json
          git add pandas.json
          if git diff --cached --quiet; then
            echo "badge unchanged"
            exit 0
          fi
          git commit -m "pandas badge: $RESULT"
          git push "$remote" HEAD:badges
