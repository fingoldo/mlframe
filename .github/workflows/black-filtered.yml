name: Black

on:
  # TEMPORARY (audits/ci_review_2026-09-08/_TRACKER.md, X5): push trigger disabled while iterating
  # on the macOS libomp/LightGBM crash fix -- ci.yml itself is macos-only for the same reason.
  # Restore the push block once macOS is confirmed stable across a few consecutive pushes.
  pull_request:
    branches: [master]
  workflow_dispatch:

# Without this, every push queues an independent run that's never superseded --
# on a repo with this much push frequency (concurrent /loop sessions) the queue
# grows unboundedly and starves the runner pool for every other workflow (2026-07-06).
# Only the LATEST push's check matters, so cancel superseded ones.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Extracted to fingoldo/py-ci-shared (2026-07-09): identical logic to pyutilz's own Black
# workflow, script now lives in the shared py_ci_shared package instead of scripts/ here.
jobs:
  black:
    permissions:
      contents: read
    uses: fingoldo/py-ci-shared/.github/workflows/black-filtered.yml@da63ad7280a1724ddcbe0b9db9e827a6ede70556  # v1
    with:
      check-path: src/mlframe
