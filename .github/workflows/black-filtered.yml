name: Black

on:
  # Pushes here go straight to master and no pull requests are opened, so a `pull_request` trigger never
  # fires and this gate had no automatic trigger at all. Ubuntu, no tests: the macOS abort that disabled
  # it (X5) cannot reach this workflow.
  push:
    branches: [master]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "audits/**"
      - "LICENSE"
  pull_request:
    branches: [master]
  workflow_dispatch:

# Without this, every push queues an independent run that's never superseded --
# on a repo with this much push frequency (concurrent /loop sessions) the queue
# grows unboundedly and starves the runner pool for every other workflow (2026-07-06).
# Only the LATEST push's check matters, so cancel superseded ones.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Extracted to fingoldo/py-ci-shared (2026-07-09): identical logic to pyutilz's own Black
# workflow, script now lives in the shared py_ci_shared package instead of scripts/ here.
jobs:
  black:
    permissions:
      contents: read
    uses: fingoldo/py-ci-shared/.github/workflows/black-filtered.yml@6a8e3829678dab35e21d380292f7b34ae84c8d14  # v1.17.0  # pragma: allowlist secret
    with:
      py-ci-shared-ref: 6a8e3829678dab35e21d380292f7b34ae84c8d14  # v1.17.0  # pragma: allowlist secret
      check-path: src/mlframe
