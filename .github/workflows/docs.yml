name: docs

# Build the MkDocs site on every PR (validation) and deploy it to GitHub Pages
# on pushes to master. Enable Pages for the repo with "GitHub Actions" as the
# source for the deploy job to publish. Extracted to fingoldo/py-ci-shared (2026-07-09).

on:
  # TEMPORARY (audits/ci_review_2026-09-08/_TRACKER.md, X5): push trigger disabled while iterating
  # on the macOS libomp/LightGBM crash fix -- ci.yml itself is macos-only for the same reason.
  # Restore the push block once macOS is confirmed stable across a few consecutive pushes.
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The reusable workflow's own `deploy` job declares `permissions: pages: write, id-token: write`
# internally, but a job calling a reusable workflow is capped at whatever the CALLING workflow
# grants here -- job-level permissions inside the callee cannot exceed this ceiling regardless of
# what they ask for. Found 2026-07-09: contents:read-only here failed every push with "The nested
# job 'deploy' is requesting 'pages: write, id-token: write', but is only allowed 'pages: none,
# id-token: none'" -- deploy is skipped by its own PUBLISH_DOCS gate by default, so granting these
# unconditionally is safe (unused permissions on a skipped job, not a live escalation).
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  docs:
    uses: fingoldo/py-ci-shared/.github/workflows/docs.yml@915217a4a8cdecc60b67c2c6c8dfe81de2f8a91c  # v1
    with:
      default-branch: master
      # composite_targets_tutorial.ipynb imports mlframe; install the package so a future flip
      # of mkdocs-jupyter `execute: false` -> true keeps building. Notebooks render from stored
      # outputs today (execute: false in mkdocs.yml), so --no-deps suffices: it registers
      # mlframe without resolving its deps (pyutilz is first-party, absent from PyPI, so a full
      # resolve fails).
      install-command: |
        pip install -e . --no-deps
        pip install "mkdocs-material>=9.5" "mkdocs-jupyter>=0.24"
