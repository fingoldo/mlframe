name: Dependabot auto-merge

# Enables EVERY Dependabot PR (github-actions + pip ecosystems, see dependabot.yml) to merge
# itself once this repo's own CI is green, without a human clicking merge or reviewing the version
# jump -- including major bumps. Requested explicitly (2026-08-23): the prior version gated major
# bumps to manual review (parsed from the PR title's "from X.Y.Z to A.B.C" pair), but the
# github-actions group's grouped-PR title ("Bump the github-actions group across N updates") has no
# parseable per-dependency version pair anyway, so that gate mostly just left grouped PRs sitting
# unreviewed for weeks (confirmed: 3 unmerged/closed-without-merge github-actions group PRs since
# July) rather than actually catching a breaking change -- the manual step was toil without a real
# safety payoff. The full CI suite (ruff/mypy/black/tests/bandit/etc.) is what actually gates a bad
# bump now, same as it gates any other push to master; a genuinely breaking dependency update fails
# CI and auto-merge simply never fires, same outcome a human reviewer would reach by watching the
# same CI run.
#
# Uses GitHub's native auto-merge (`gh pr merge --auto`), which queues the merge and only actually
# merges once every check already running on the PR succeeds -- this repo has no branch-protection
# required-checks rule (deliberately, to keep direct-push-to-master unblocked for maintainer work),
# so auto-merge itself is what gates on CI here, not a protection rule.
#
# Deliberately `pull_request` (not `pull_request_target`): every branch dependabot.yml opens lives
# in THIS repo, never a fork, so a same-repo `pull_request` trigger already gets a GITHUB_TOKEN with
# the write permissions requested below -- no need for pull_request_target's fork-secrets-exposure
# risk, which this workflow would otherwise carry for zero benefit (it never checks out PR code).

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Enable auto-merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge --auto --squash "$PR_URL"
