name: release

# Publishes to PyPI on a published GitHub Release (or a v* tag) using PyPI
# Trusted Publishing (OIDC) — no API token is stored as a secret.
#
# One-time setup on PyPI: add a Trusted Publisher for this repo pointing at
# this workflow file (release.yml) and the "pypi" environment below.
#
# NOTE: a successful upload requires the runtime dependency `pyutilz` to be
# available on PyPI; until then this workflow builds and validates but the
# upload step will be the gating action to run only once that is true.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build sdist + wheel
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write      # attest-build-provenance signs via OIDC
      attestations: write
    # Every other job in this repo's workflows sets an explicit timeout-minutes; this one job was
    # the sole omission (2026-07-18 architecture review). Low risk in practice (build+twine-check
    # is fast and deterministic) but inconsistent with the rest of the codebase's own discipline.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990  # v8.3.2
        with:
          enable-cache: false

      # Guard against a tag/version mismatch: the release fires on a `v*` tag but
      # the wheel version comes from `mlframe.__version__` (version.py). Publishing
      # a wheel whose version disagrees with the tag is silent and unrecoverable
      # on PyPI, so fail fast. Skipped for manual dispatch runs (no tag ref).
      - name: Assert git tag matches package version
        if: github.event_name == 'release'
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(python -c "ns={}; exec(open('src/mlframe/version.py').read(), ns); print(ns['__version__'])")
          echo "tag=$TAG package=$PKG"
          test "$TAG" = "$PKG" || { echo "::error::git tag ($TAG) != mlframe.__version__ ($PKG)"; exit 1; }

      - name: Build distributions
        run: uv build

      - name: Verify distributions with twine
        run: uvx twine check dist/*

      # Signed, verifiable provenance for what was built, alongside the Trusted Publishing already used
      # for the upload itself. Release-only: a dispatch build has no release to attest against.
      - name: Attest build provenance
        if: github.event_name == 'release'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: dist/*

      - name: Upload built distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: dist
          path: dist/

  publish:
    name: publish to PyPI
    # workflow_dispatch is a trigger on this workflow so the build/validate legs can be exercised from
    # any ref. Uploading is irreversible, so only a real release event may reach it -- a dispatch would
    # otherwise publish whatever version.py happens to say on that ref, unguarded by the tag/version
    # equality assert, which is itself gated on the release event.
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/mlframe
    permissions:
      id-token: write  # required for Trusted Publishing (OIDC)
    steps:
      - name: Download built distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247  # release/v1
