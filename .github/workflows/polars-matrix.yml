# Polars-version matrix for the polars-facing tests.
#
# ci.yml installs polars from uv.lock, so a breaking release only shows up when some run happens to resolve it. polars 2.0 removed
# read_parquet(allow_missing_columns=True) and the Series.to_numpy zero_copy_only keyword; compute_mps_targets then raised a TypeError that
# its caller swallowed into "no targets", and nothing failed. This workflow runs the tests that touch polars against the locked version,
# the newest 1.x, polars 2 and whatever pip resolves today, once a day and whenever the dependency declarations change.
#
# Selection is by name (-k polars) over the feature-engineering and training suites: the polars-native frames, bridges and loaders all
# carry the word in their module or test names. Slow, GPU and multi-GPU tests stay with the nightly and GPU workflows.

name: polars-matrix

on:
  schedule:
    - cron: "37 4 * * *"
  push:
    branches: [master]
    paths:
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/polars-matrix.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    name: polars ${{ matrix.polars-version }} on py${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      NUMBA_CACHE_DIR: ${{ github.workspace }}/.numba-cache
      PYTHONUNBUFFERED: "1"
      MLFRAME_FAST: "1"
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]
        polars-version:
          - "1.36.1"  # the version uv.lock resolves
          - "1.41.2"  # newest 1.x seen
          - "2.0.0"   # first major release
          - "latest"  # whatever pip resolves today, so the next release is seen on its first day

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Clone & install pyutilz (sibling dependency)
        # pyutilz is not on PyPI; the narrow extras mlframe transitively imports, as in sklearn-matrix-ci.yml.
        run: |
          git clone https://github.com/fingoldo/pyutilz.git
          git -C pyutilz checkout d64ac2c2a2cf121c24c8c093126fe8f9553f03a7
          pip install "./pyutilz[system,pandas,polars,database]"

      - name: Install mlframe and the test tooling
        # The union of extras the polars-facing tests import at collection (boosting, calibration, polars_ext, db for zstandard);
        # py-ci-shared is a git checkout no extra can declare (see requirements-dev.txt).
        # numpy is capped below 2.5: catboost 1.2.10 fails to import on 2.5.3 (ValueError in _catboost init), which is unrelated to polars.
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[boosting,calibration,viz,signal,stats,sampling,unsupervised,polars_ext,db,dev]" "numpy<2.5"
          pip install -r requirements-dev.txt

      - name: Pin polars to ${{ matrix.polars-version }}
        # polars 1.37+ ships its native module as the separate polars-runtime-32 wheel, which must match polars exactly: replacing only
        # polars leaves the runtime of the other version in place and polars then imports without its native module (NameError: plr).
        env:
          POLARS_VERSION: ${{ matrix.polars-version }}
        run: |
          pip uninstall -y polars polars-runtime-32
          if [ "$POLARS_VERSION" = "latest" ]; then
            pip install polars
          else
            pip install "polars==${POLARS_VERSION}"
          fi

      - name: Show installed versions
        run: |
          python -c "import polars; print('polars', polars.__version__)"
          python -c "import pandas; print('pandas', pandas.__version__)"
          python -c "import numpy; print('numpy', numpy.__version__)"
          python -c "import mlframe; print('mlframe', mlframe.__version__)"

      - name: Restore numba JIT cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ github.workspace }}/.numba-cache
          key: numba-polarsmatrix-${{ runner.os }}-py${{ matrix.python-version }}-${{ hashFiles('src/**/*.py') }}
          restore-keys: |
            numba-polarsmatrix-${{ runner.os }}-py${{ matrix.python-version }}-

      - name: Polars-facing tests
        run: |
          pytest tests/feature_engineering tests/training \
            -k polars \
            -m "not slow and not gpu and not multigpu" \
            --no-cov \
            -p no:randomly \
            -n auto \
            --timeout=900 \
            -v
