name: codecov-full

# ci.yml's "codecov" badge and numba-coverage.yml's "codecov-numba" badge measure overlapping,
# not disjoint, slices of the same codebase (ci.yml runs the whole suite under normal JIT, where
# every @njit body is invisible to coverage.py; numba-coverage.yml re-runs a NARROWER subset --
# feature_engineering/feature_selection/metrics/training, minus biz_val -- under
# NUMBA_DISABLE_JIT=1 specifically to see inside those bodies). Their percentages cannot be added
# together to get a combined figure. This job computes the real thing: downloads both jobs' raw
# per-shard `.coverage` data files (18 total: ci.yml's 10 + numba-coverage.yml's 8), merges them
# with `coverage combine` (a line counts as covered if EITHER run executed it), and uploads the
# result to Codecov under its own `combined` flag -- the `codecov-full` badge.
#
# Scheduled (not workflow_run off numba-coverage-nightly's completion) -- zizmor flags
# workflow_run as a fundamentally insecure trigger class (the classic risk is a fork PR's
# workflow_run handler running privileged/secret-bearing code against attacker-controlled
# content). This job carries CODECOV_TOKEN, so even though numba-coverage-nightly itself is
# schedule/workflow_dispatch-only (no fork-PR path feeds it), a fixed daily cron sidesteps the
# whole trigger class cleanly instead of arguing the specific case is safe. numba-coverage.yml's
# cron fires at 03:00 UTC with a 340min job timeout -- 10:00 UTC gives real headroom past its
# worst case (~08:40 UTC) before this job looks for that run's artifacts.
#
# Falls back to the latest successful ci.yml run on master for the OTHER side's data, which need
# not be the exact same commit as the nightly's -- acceptable drift for a coverage trend badge,
# not a per-commit gate.

on:
  schedule:
    - cron: "0 10 * * *"
  workflow_dispatch: {}

permissions:
  contents: read
  actions: read

jobs:
  merge-and-upload:
    name: Merge ci.yml + numba-coverage.yml raw coverage, upload combined flag
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v6.0.0
        with:
          python-version: "3.11"

      - name: Install coverage
        run: pip install "coverage[toml]>=7.0"

      - name: Find the latest completed numba-coverage-nightly run
        id: find_numba_run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          run_id=$(gh run list --repo "${{ github.repository }}" --workflow numba-coverage.yml \
            --status completed --limit 1 --json databaseId --jq '.[0].databaseId')
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          if [ -z "$run_id" ]; then
            echo "No completed numba-coverage-nightly run found."
          fi

      - name: Download numba-coverage-nightly's raw shard data
        if: steps.find_numba_run.outputs.run_id != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          pattern: raw-coverage-numba-*
          path: raw-coverage
          # NOT merge-multiple -- every shard's artifact contains a file with the SAME name
          # (`.coverage`), so a flattened merge would let each downloaded shard overwrite the
          # last, silently combining only 1 of 18. False keeps one subdirectory per artifact.
          merge-multiple: false
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ steps.find_numba_run.outputs.run_id }}
          repository: ${{ github.repository }}

      - name: Find the latest successful ci.yml run on master
        id: find_ci_run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          run_id=$(gh run list --repo "${{ github.repository }}" --workflow ci.yml --branch master \
            --status success --limit 1 --json databaseId --jq '.[0].databaseId')
          if [ -z "$run_id" ]; then
            echo "No successful ci.yml run found on master -- skipping the combined upload this time."
            echo "run_id=" >> "$GITHUB_OUTPUT"
          else
            echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          fi

      - name: Download ci.yml's raw shard data
        if: steps.find_ci_run.outputs.run_id != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          pattern: raw-coverage-ci-*
          path: raw-coverage
          merge-multiple: false
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ steps.find_ci_run.outputs.run_id }}
          repository: ${{ github.repository }}

      - name: Combine and render the merged report
        run: |
          find raw-coverage -name '.coverage' | sort
          # Every shard's downloaded file is literally named `.coverage` (one per subdirectory,
          # see the merge-multiple note above) -- rename each into one flat directory as
          # `.coverage.shardN` so `coverage combine` (which scans a directory for `.coverage`/
          # `.coverage.*` data files) sees all 18 as distinct inputs instead of 1.
          mkdir -p combined_input
          i=0
          while IFS= read -r -d '' f; do
            i=$((i + 1))
            cp "$f" "combined_input/.coverage.shard$i"
          done < <(find raw-coverage -name '.coverage' -print0)
          if [ "$i" -eq 0 ]; then
            echo "No raw coverage data downloaded from either workflow -- nothing to combine."
            exit 1
          fi
          echo "Combining $i shard coverage files"
          coverage combine combined_input
          coverage xml -o coverage-full.xml
          coverage report

      - name: Upload combined coverage to Codecov
        uses: fingoldo/py-ci-shared/.github/actions/upload-codecov@f50288e5a6f5b7f972efb60f948ce6184c8e9e70  # v1.3.4
        with:
          files: ./coverage-full.xml
          flags: combined
          token: ${{ secrets.CODECOV_TOKEN }}
