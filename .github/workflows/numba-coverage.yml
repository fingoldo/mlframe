name: numba-coverage-nightly

# Re-enabled 2026-08-11: was disabled 2026-07-10 (340min timeout, full feature_engineering/
# feature_selection/metrics/training suites under NUMBA_DISABLE_JIT=1) after it was part of what
# exhausted the account's monthly free GitHub Actions minutes and left every workflow, in every
# repo on the account, stuck queued. `if: inputs.run` gated real runs behind a manual
# workflow_dispatch since then -- `github.event.inputs` is empty for a schedule-triggered run, so
# the 03:00 UTC cron fired the workflow shell every night but the job body never actually ran (0
# minutes spent), which also meant GitHub's workflow-level badge showed the (accurate) "skipped"
# conclusion as a permanently red "failing" pill with no way to distinguish it from a real
# failure. Now runs on the actual nightly cron; workflow_dispatch's `run` input still lets a
# manual invocation opt OUT (set to false) if the Actions-minutes budget needs relief again.
#
# Sharded 8 ways (2026-08-18): this job ran as a SINGLE unsharded job with only intra-job xdist
# parallelism (`-n 4`, capped below `auto` -- see the "Run kernel-heavy test suites" step comment)
# on one 2-vCPU runner. Under NUMBA_DISABLE_JIT=1 kernel-heavy tests run 10-1000x slower than
# under normal JIT (see the job's own timeout-minutes comment below), so this suite needed
# job-level sharding across multiple runners even MORE than ci.yml's normal-speed matrix does --
# yet it had none, running the whole subset in one job against the 340m hard-cap headroom on
# every nightly run. Mirrors ci.yml's proven `--splits N --group M` pattern (10-way there); 8
# shards here since this job's scope (feature_engineering/feature_selection/metrics/training,
# --ignore=biz_val) is a narrower subset of the full suite. `-n 4` per shard is unchanged --
# that limit exists to avoid nested joblib oversubscription within ONE job (each xdist worker's
# MRMR.fit() spawns its own joblib fan-out), which job-level sharding doesn't affect.
#
# Also added `--store-durations`/`--durations=200` with a durations file distinct from the main
# CI's `.test_durations` (this job's NUMBA_DISABLE_JIT=1 timings are wildly different from
# normal-JIT timings and would corrupt ci.yml's shard-balancing data if they shared a file) --
# previously this job had NO durations tracking at all, so pytest-split would otherwise balance
# the FIRST sharded run by raw file count alone. Seeded `.test_durations_numba_disabled` instead
# from ci.yml's own `.test_durations` (25489 overlapping node IDs, filtered to this job's scope:
# feature_engineering/feature_selection-minus-biz_val/metrics/training), unscaled -- pytest-split's
# duration_based_chunks only balances on RELATIVE proportions between tests, so a uniform (if
# individually wrong, given the 10-1000x/test-dependent slowdown) scale factor doesn't change the
# split at all; a normal-JIT-derived seed already correlates far better with real relative cost
# than pure file-count would. This nightly's own `merge-test-durations` job overwrites it with
# real NUMBA_DISABLE_JIT=1 timings after the first run, so the seed only matters once.

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      run:
        description: "Actually run the nightly (set false to skip a manual dispatch without disabling the cron)"
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  numba-disabled-coverage:
    # inputs.run is only populated for a workflow_dispatch event -- for the schedule trigger it's
    # always empty/falsy regardless of the declared default above, so the schedule leg must be let
    # through explicitly rather than relying on inputs.run alone.
    if: github.event_name != 'workflow_dispatch' || inputs.run
    name: pytest with NUMBA_DISABLE_JIT=1 (kernel-body coverage) (shard ${{ matrix.group }}/8)
    runs-on: ubuntu-latest
    # 340 (near the 360min hosted-runner hard ceiling): under NUMBA_DISABLE_JIT=1, kernel-heavy
    # fixtures (permutation-null loops, discretization, orthogonal-basis FE) run 10-1000x slower
    # than under normal JIT, since the whole point of the run is to make @njit bodies visible to
    # coverage.py by NOT compiling them. 120min was consistently insufficient (10 consecutive
    # nightly failures/cancellations 2026-06-29..2026-07-08 before this fix). Kept as headroom
    # after 2026-08-18's 8-way sharding, not lowered -- a cold/imbalanced shard should still have
    # room to finish and report real failures instead of being truncated.
    timeout-minutes: 340
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11"]
        group: ["1", "2", "3", "4", "5", "6", "7", "8"]
    env:
      NUMBA_DISABLE_JIT: "1"
      PYTHONUNBUFFERED: "1"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Clone & install pyutilz (sibling dependency)
        run: |
          git clone https://github.com/fingoldo/pyutilz.git
          git -C pyutilz checkout 0ebbdc23472a3a0827731588c5fe36a63dc393ad  # pinned 2026-08-19, see X_CICD_DEPENDENCIES-1 -- register_default_cache DEFAULT-cache-fallback diagnostics
          pip install "./pyutilz[system,pandas,polars,database]"

      - name: Install mlframe with all runtime extras + dev tooling
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[all,dev]"

      - name: Show installed versions
        run: |
          python -c "import mlframe; print('mlframe', mlframe.__version__)"
          python -c "import numba; print('numba', numba.__version__)"
          python -c "import os; print('NUMBA_DISABLE_JIT =', os.environ.get('NUMBA_DISABLE_JIT'))"

      - name: Run kernel-heavy test suites with NUMBA_DISABLE_JIT=1
        run: |
          # -n 4 (not auto): xdist workers here each run full MRMR.fit() calls that internally
          # spawn their own joblib parallelism; `-n auto` (one worker per core) oversubscribed
          # the runner and crashed a worker mid-run (pytest-xdist INTERNALERROR, 2026-07-08).
          # --ignore=biz_val: those 50 files are quantitative ML-trick accuracy tests (see
          # CLAUDE.md's biz_value section), already covered under normal JIT by the main CI
          # matrix; running them here just burns the nightly's time budget on multi-minute
          # full-model fits without adding kernel-BODY coverage the non-biz_val unit tests don't
          # already provide.
          # --durations-path: kept separate from ci.yml's `.test_durations` -- NUMBA_DISABLE_JIT=1
          # timings (10-1000x normal-JIT cost) would badly skew that file's shard-balancing data
          # for the normal-speed main CI matrix if they shared a path.
          # --timeout=3600 (raised from 1200, 2026-08-18): a permutation-null MI test hit the old
          # 1200s per-test cap mid-kernel (info_theory/_batch_kernels.py's joint_counts accumulation
          # loop) -- under NUMBA_DISABLE_JIT=1 that kernel runs as a plain Python nested loop, and
          # this job's own 10-1000x-slower framing means a test that normally finishes in a couple
          # seconds under JIT can legitimately need north of 1200s here. 3600s gives real headroom;
          # the 340m job cap still bounds a shard that has several such tests back to back.
          pytest -m "not slow and not gpu and not multigpu" \
            --splits 8 --group ${{ matrix.group }} \
            -n 4 \
            --cov=src/mlframe \
            --cov-report=xml \
            --cov-report=term-missing \
            -p no:randomly \
            --timeout=3600 \
            --durations=200 \
            --store-durations \
            --durations-path=.test_durations_numba_disabled \
            --ignore=tests/feature_selection/biz_val \
            tests/feature_engineering/ \
            tests/feature_selection/ \
            tests/metrics/ \
            tests/training/

      - name: Upload shard test durations
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: test-durations-numba-disabled-${{ matrix.group }}
          path: .test_durations_numba_disabled
          retention-days: 3
          include-hidden-files: true
          if-no-files-found: ignore

      - name: Upload coverage XML as artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: always()
        with:
          name: coverage-numba-disabled-${{ matrix.group }}
          path: coverage.xml
          retention-days: 14

      - name: Upload coverage to Codecov (numba-disabled flag)
        uses: fingoldo/py-ci-shared/.github/actions/upload-codecov@f50288e5a6f5b7f972efb60f948ce6184c8e9e70  # v1.3.4
        # (success() || failure()): a failure in one shard must not hide the other 7 shards'
        # coverage from Codecov -- mirrors ci.yml's identical fix for the same reason.
        if: success() || failure()
        with:
          files: ./coverage.xml
          flags: numba-disabled
          token: ${{ secrets.CODECOV_TOKEN }}

  # Folds every shard's freshly-measured `.test_durations_numba_disabled` slice back into one file
  # and commits it, mirroring ci.yml's `merge-test-durations` job -- keeps pytest-split's shard
  # balancing current on every nightly run instead of relying solely on file-count balancing
  # forever. Runs on both the schedule and an explicit workflow_dispatch (this workflow has no
  # push trigger to gate on the way ci.yml's merge job does).
  merge-test-durations:
    name: Merge + commit .test_durations_numba_disabled
    runs-on: ubuntu-latest
    needs: numba-disabled-coverage
    if: always() && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.run))
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: true

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          pattern: test-durations-numba-disabled-*
          path: .test_durations_numba_disabled_shards
          merge-multiple: false

      - name: Merge shard durations
        run: |
          python - <<'PY'
          import json
          import pathlib

          merged = {}
          # Sorted for deterministic merge order (last-write-wins on a nodeid two shards both
          # happened to freshly measure this run -- either value is a valid balancing input,
          # determinism just keeps output diffs reviewable).
          for f in sorted(pathlib.Path(".test_durations_numba_disabled_shards").glob("*/.test_durations_numba_disabled")):
              try:
                  merged.update(json.loads(f.read_text()))
              except (json.JSONDecodeError, OSError):
                  continue
          pathlib.Path(".test_durations_numba_disabled").write_text(json.dumps(merged, sort_keys=True, indent=4))
          print(f"[merge-test-durations] merged {len(merged)} entries")
          PY

      - name: Commit updated .test_durations_numba_disabled
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- .test_durations_numba_disabled; then
            echo "No change to .test_durations_numba_disabled"
            exit 0
          fi
          git add .test_durations_numba_disabled
          git commit -m "chore: refresh .test_durations_numba_disabled (post-nightly shard rebalance)"
          git push origin HEAD:"$REF_NAME"

# Future idea (2026-07-10, not implemented): a re-scoped "codecov-numba" job narrowed to ACTUALLY
# numba-touching tests via a `@pytest.mark.numba` marker (doesn't exist yet -- would need a triage
# pass tagging tests across the ~190 src/mlframe/**/*.py files that use @njit) instead of whole
# subpackage directories, which wouldn't narrow anything today since numba usage is pervasive across
# nearly every subpackage. The full job sketch that was here lives in git history (see this file's
# blame around 2026-07-10) if this gets picked up.
