name: numba-coverage-nightly

# Re-enabled 2026-08-11: was disabled 2026-07-10 (340min timeout, full feature_engineering/
# feature_selection/metrics/training suites under NUMBA_DISABLE_JIT=1) after it was part of what
# exhausted the account's monthly free GitHub Actions minutes and left every workflow, in every
# repo on the account, stuck queued. `if: inputs.run` gated real runs behind a manual
# workflow_dispatch since then -- `github.event.inputs` is empty for a schedule-triggered run, so
# the 03:00 UTC cron fired the workflow shell every night but the job body never actually ran (0
# minutes spent), which also meant GitHub's workflow-level badge showed the (accurate) "skipped"
# conclusion as a permanently red "failing" pill with no way to distinguish it from a real
# failure. Now runs on the actual nightly cron; workflow_dispatch's `run` input still lets a
# manual invocation opt OUT (set to false) if the Actions-minutes budget needs relief again.

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      run:
        description: "Actually run the nightly (set false to skip a manual dispatch without disabling the cron)"
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  numba-disabled-coverage:
    # inputs.run is only populated for a workflow_dispatch event -- for the schedule trigger it's
    # always empty/falsy regardless of the declared default above, so the schedule leg must be let
    # through explicitly rather than relying on inputs.run alone.
    if: github.event_name != 'workflow_dispatch' || inputs.run
    name: pytest with NUMBA_DISABLE_JIT=1 (kernel-body coverage)
    runs-on: ubuntu-latest
    # 340 (near the 360min hosted-runner hard ceiling): under NUMBA_DISABLE_JIT=1, kernel-heavy
    # fixtures (permutation-null loops, discretization, orthogonal-basis FE) run 10-1000x slower
    # than under normal JIT, since the whole point of the run is to make @njit bodies visible to
    # coverage.py by NOT compiling them. 120min was consistently insufficient (10 consecutive
    # nightly failures/cancellations 2026-06-29..2026-07-08 before this fix).
    timeout-minutes: 340
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11"]
    env:
      NUMBA_DISABLE_JIT: "1"
      PYTHONUNBUFFERED: "1"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Clone & install pyutilz (sibling dependency)
        run: |
          git clone https://github.com/fingoldo/pyutilz.git
          git -C pyutilz checkout 39eb5416d43c69bdb57aece636d7da9c5f08cd7c  # pinned 2026-08-04, see X_CICD_DEPENDENCIES-1
          pip install "./pyutilz[system,pandas,polars,database]"

      - name: Install mlframe with all runtime extras + dev tooling
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[all,dev]"

      - name: Show installed versions
        run: |
          python -c "import mlframe; print('mlframe', mlframe.__version__)"
          python -c "import numba; print('numba', numba.__version__)"
          python -c "import os; print('NUMBA_DISABLE_JIT =', os.environ.get('NUMBA_DISABLE_JIT'))"

      - name: Run kernel-heavy test suites with NUMBA_DISABLE_JIT=1
        run: |
          # -n 4 (not auto): xdist workers here each run full MRMR.fit() calls that internally
          # spawn their own joblib parallelism; `-n auto` (one worker per core) oversubscribed
          # the runner and crashed a worker mid-run (pytest-xdist INTERNALERROR, 2026-07-08).
          # --ignore=biz_val: those 50 files are quantitative ML-trick accuracy tests (see
          # CLAUDE.md's biz_value section), already covered under normal JIT by the main CI
          # matrix; running them here just burns the nightly's time budget on multi-minute
          # full-model fits without adding kernel-BODY coverage the non-biz_val unit tests don't
          # already provide.
          pytest -m "not slow and not gpu and not multigpu" \
            -n 4 \
            --cov=src/mlframe \
            --cov-report=xml \
            --cov-report=term-missing \
            -p no:randomly \
            --timeout=1200 \
            --ignore=tests/feature_selection/biz_val \
            tests/feature_engineering/ \
            tests/feature_selection/ \
            tests/metrics/ \
            tests/training/

      - name: Upload coverage XML as artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: always()
        with:
          name: coverage-numba-disabled
          path: coverage.xml
          retention-days: 14

      - name: Upload coverage to Codecov (numba-disabled flag)
        uses: fingoldo/py-ci-shared/.github/actions/upload-codecov@f50288e5a6f5b7f972efb60f948ce6184c8e9e70  # v1.3.4
        if: success()
        with:
          files: ./coverage.xml
          flags: numba-disabled
          token: ${{ secrets.CODECOV_TOKEN }}

# Future idea (2026-07-10, not implemented): a re-scoped "codecov-numba" job narrowed to ACTUALLY
# numba-touching tests via a `@pytest.mark.numba` marker (doesn't exist yet -- would need a triage
# pass tagging tests across the ~190 src/mlframe/**/*.py files that use @njit) instead of whole
# subpackage directories, which wouldn't narrow anything today since numba usage is pervasive across
# nearly every subpackage. The full job sketch that was here lives in git history (see this file's
# blame around 2026-07-10) if this gets picked up.
