name: MyPy

# Whole-project mypy check (the fast strict-mode beachhead workflow was retired). Extracted to
# fingoldo/py-ci-shared (2026-07-09); the install-command below mirrors ci.yml's `test` job
# install step PLUS [gpu] (cupy/numba.cuda) -- mypy needs cupy/numba.cuda's real stubs to
# type-check the GPU-optional code paths (``try: import cupy as cp / except ImportError: cp =
# None``); without them every such module mis-resolves the fallback branch as a type error
# (confirmed 2026-07-08: 48 errors in 21 files, all numba.cuda/cupy-shaped, with [gpu] excluded).
# cupy imports fine on a GPU-less CPU runner -- it only fails when you actually touch the device
# (see gpu-extras-install-matrix.yml) -- so this is safe on ubuntu-latest despite there being no
# GPU here. `advisory: false` because this backlog was closed to 0 as of 2026-07-08 -- this is a
# real blocking gate, not advisory (see the reusable workflow's header comment for why that's a
# per-repo choice, never a hardcoded default).

on:
  # This repository pushes straight to master and opens no pull requests, so a `pull_request` trigger
  # fires never: without the push block below this blocking gate had NO automatic trigger at all, and
  # twelve whole-project errors reached master between 2026-09-11 and 2026-09-22 with nothing to catch
  # them. It runs on ubuntu and runs no tests, so the macOS pytest abort that disabled it (X5) cannot
  # reach it -- it was collateral in a sweep, not a decision about this workflow.
  push:
    branches: [master]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "audits/**"
      - "LICENSE"
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mypy-full:
    permissions:
      contents: read
    uses: fingoldo/py-ci-shared/.github/workflows/mypy-full.yml@6a8e3829678dab35e21d380292f7b34ae84c8d14  # v1.17.0  # pragma: allowlist secret
    with:
      package-name: mlframe
      mypy-version: "2.1.0"
      advisory: false
      install-command: |
        git clone https://github.com/fingoldo/pyutilz.git
        git -C pyutilz checkout 960399fafa8e72c536b25a9cbace0b302688a968  # see X_CICD_DEPENDENCIES-1 for why this is pinned -- narrowed code_audit scanners + the private-assertion-helper fix
        # UV_NO_SOURCES: [tool.uv.sources] points pyutilz at git and this line installs it from the
        # clone above; without it uv refuses on conflicting URLs for the same package. A reusable
        # workflow call cannot carry `env:`, so it is set on the command.
        UV_NO_SOURCES=1 uv pip install --system "./pyutilz[system,pandas,polars,database]" -e ".[all,dev,gpu]"
