name: Update .test_durations

# Regenerates .test_durations (pytest-split's default-path duration file, auto-discovered by
# ci.yml's `--splits N --group N` invocation with no extra flag needed) so the sharded split
# balances by measured per-test time instead of file count -- a shard that happens to collect
# many numba-cold-JIT or model-training-heavy files otherwise runs far longer than its siblings
# despite an equal file count. Added 2026-07-18 CI/CD architecture review: seeded to an empty
# `{}` in the same commit that added this workflow (a real multi-hour full-suite run to populate
# it wasn't feasible inline in that change), so pytest-split falls back to file-count splitting
# for any test missing a recorded duration until this job's first successful run fills it in.
#
# SUPERSEDED 2026-08-15 by ci.yml's `merge-test-durations` job: every push now merges each
# shard's own freshly-measured durations directly, so this separate weekly full-suite run is no
# longer the primary mechanism -- kept as a slow-but-thorough fallback (still catches nodeids no
# recent push's shard happened to touch). Root cause of `.test_durations` staying `{}` this whole
# time either way: THIS workflow's own unsharded 2-worker run structurally cannot finish inside
# any job-timeout ceiling (it does all 16 shards' worth of work with the parallelism of 1), so it
# never once reached the commit step; ci.yml's shard count was raised 8->16 the same day to break
# a related bootstrapping deadlock (see ci.yml's own comment) where cancelled shards contributed no
# duration data either.
#
# Runs the FULL suite unsharded, so it's slow (expect close to the sum of all 16 shards' current
# wall time) -- deliberately off the critical path (scheduled + manual dispatch only, never on
# push/PR).

on:
  schedule:
    - cron: "0 4 * * 0"  # weekly, Sunday 04:00 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  update-test-durations:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      NUMBA_CACHE_DIR: ${{ github.workspace }}/.numba-cache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: true

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml

      - uses: fingoldo/py-ci-shared/.github/actions/install-pyutilz@71957762ddd99200a66e3312a8ef9293b4c5d939  # v1.4.0
        with:
          pyutilz-extras: "system,pandas,polars,database"
          project-extras: ".[all,dev]"
          # See ci.yml's identical pin for why -- this action had no way to honour a pin until
          # pyutilz-ref was added; matches the SHA every other pyutilz-cloning workflow already pins.
          pyutilz-ref: 0ebbdc23472a3a0827731588c5fe36a63dc393ad  # pragma: allowlist secret -- git commit SHA, not a secret

      - name: Restore numba JIT cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ github.workspace }}/.numba-cache
          key: numba-Linux-py3.11-${{ hashFiles('src/**/*.py') }}
          restore-keys: |
            numba-Linux-py3.11-

      - name: Run full suite with --store-durations
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          pytest -m "not slow and not gpu and not multigpu" \
            --store-durations \
            -n auto \
            -p no:randomly \
            --timeout=900 \
            || true

      - name: Commit updated .test_durations
        env:
          # zizmor template-injection: github.ref_name must never be spliced directly into a run:
          # script (an attacker-controlled branch name could inject shell code) -- pass it through
          # an env var instead, same pattern this repo's other workflows already use.
          REF_NAME: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- .test_durations; then
            echo "No change to .test_durations"
            exit 0
          fi
          git add .test_durations
          git commit -m "chore: refresh .test_durations (scheduled pytest-split rebalance)"
          git push origin HEAD:"$REF_NAME"
